<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kissaan Saathi — Offline</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 24px;
      text-align: center;
      background: #FBF7EE;
      color: #5B4636;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    img { width: 72px; height: 72px; }
    h1 { color: #1F4D36; font-size: 20px; margin: 0; }
    p { margin: 0; font-size: 14px; max-width: 280px; }
    button {
      margin-top: 8px;
      background: #1F4D36;
      color: #FBF7EE;
      border: none;
      border-radius: 10px;
      padding: 12px 20px;
      font-size: 15px;
      min-height: 48px;
    }
  </style>
</head>
<body>
  <img src="/icons/icon-192.png" alt="Kissaan Saathi" />
  <h1>You're offline</h1>
  <p>Kissaan Saathi needs an internet connection for orders, listings and payments. Please reconnect and try again.</p>
  <button onclick="location.reload()">Retry</button>
</body>
</html>
